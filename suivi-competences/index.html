<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" data-keep="head">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" data-keep="head">
<title>Suivi compétences CRM</title>
<meta name="theme-color" content="#0B3B3C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" data-keep="head">
<style data-keep="head">
/* Bandeau institutionnel, puis onglets ; les niveaux 0-3 sont l'information principale : couleurs pleines, chiffres lisibles. */
:root{
  --ink:#0B3B3C; --ink-2:#365B5B; --muted:#5F6F6E; --paper:#FFFFFF; --panel:#F3F8F7; --line:#C9DCDA; --accent:#F2A900; --accent-ink:#3A2A00;
  --l0:#C62828; --l0t:#FFFFFF; --l1:#F4C20D; --l1t:#3A2A00; --l2:#8BC34A; --l2t:#173B05; --l3:#1B6E2E; --l3t:#FFFFFF; --lz:#E9EFEE; --lzt:#7A8A88;
  --font:"Lato","Calibri","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --ink:#E4F0EF; --ink-2:#B9D0CE; --muted:#9DB3B1; --paper:#0F2223; --panel:#16302F; --line:#2D4A49; --lz:#203A3A; --lzt:#8FA5A3; color-scheme:dark; }
}
:root[data-theme="dark"]{ --ink:#E4F0EF; --ink-2:#B9D0CE; --muted:#9DB3B1; --paper:#0F2223; --panel:#16302F; --line:#2D4A49; --lz:#203A3A; --lzt:#8FA5A3; color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4}
.top{background:#0B3B3C;color:#fff}
.top-in{max-width:1560px;margin:0 auto;padding:14px 16px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:14px;align-items:center}
.brand img{width:64px;height:auto;background:#fff;border-radius:8px;padding:4px}
.brand .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#F2C14E;font-weight:700}
.brand h1{margin:2px 0 0;font-size:24px;font-weight:900;text-wrap:balance}
.brand .sub{font-size:13px;color:#CFE3E1}
.who{text-align:right;font-size:13px;color:#CFE3E1}
.who b{display:block;color:#fff;font-size:15px}
.wrap{max-width:1560px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.spread{justify-content:space-between}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--muted)}
select,input{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-height:38px}
button{font:inherit;font-weight:700;border-radius:8px;padding:8px 14px;min-height:38px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent}
button.danger{background:transparent;border-color:var(--l0);color:var(--l0)}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
nav.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line)}
nav.tabs button{border:0;border-radius:8px 8px 0 0;background:transparent;color:var(--muted);padding:10px 18px}
nav.tabs button[aria-selected=true]{background:var(--ink);color:var(--paper)}
.legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lg{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:4px 12px 4px 4px;font-size:13px;font-weight:700;background:var(--panel);border:1px solid var(--line)}
.lv{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:7px;font-weight:900;font-size:14px;padding:0 6px;font-variant-numeric:tabular-nums}
.L0{background:var(--l0);color:var(--l0t)} .L1{background:var(--l1);color:var(--l1t)} .L2{background:var(--l2);color:var(--l2t)} .L3{background:var(--l3);color:var(--l3t)} .LZ{background:var(--lz);color:var(--lzt)}
.note{background:#FFF4D6;border:1px solid var(--accent);color:#3A2A00;border-radius:10px;padding:10px 14px;font-size:14px}
.err{background:#FBE1E1;border:1px solid var(--l0);color:#5A1010;border-radius:10px;padding:10px 14px;font-size:14px}
.status{font-size:12px;color:var(--muted)}
.save{display:flex;gap:10px;align-items:center;font-size:13px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:var(--l2)}
.dot.dirty{background:var(--accent)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--paper);max-height:72vh}
table{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
table.grid th,table.grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px;text-align:center;font-size:12px}
table.grid thead th{background:var(--panel);font-weight:700;white-space:nowrap;position:sticky;z-index:2}
table.grid thead tr:nth-child(1) th{top:0}
table.grid thead tr:nth-child(2) th{top:27px}
table.grid thead tr:nth-child(3) th{top:54px}
table.grid th.bloc{background:#0B3B3C;color:#fff;letter-spacing:.04em}
table.grid th.name,table.grid td.name{position:sticky;left:0;background:var(--paper);text-align:left;white-space:nowrap;padding:4px 10px;z-index:3;min-width:200px;font-size:13px}
table.grid thead th.name{background:var(--panel);z-index:4}
table.grid td.name a{color:var(--ink);font-weight:700;text-decoration:none;cursor:pointer}
table.grid td.name a:hover{text-decoration:underline}
table.grid td.c{padding:2px;cursor:pointer}
table.grid td.c .lv{width:100%;min-width:26px;height:26px;font-size:13px;border-radius:5px}
table.grid .sep{border-left:2px solid var(--ink-2)}
table.grid tfoot td{background:var(--panel);font-weight:700;position:sticky;bottom:0}
table.grid tfoot td.name{z-index:4}
.dist{display:flex;height:14px;width:140px;border-radius:4px;overflow:hidden;background:var(--lz)}
.dist span{display:block;height:100%}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{border-radius:12px;padding:10px 14px;border:1px solid var(--line);background:var(--paper)}
.tile b{display:block;font-size:30px;font-weight:900;line-height:1.1}
.tile span{font-size:12px;font-weight:700;color:var(--muted)}
.tile.L0{background:var(--l0);color:var(--l0t);border:0}.tile.L1{background:var(--l1);color:var(--l1t);border:0}.tile.L2{background:var(--l2);color:var(--l2t);border:0}.tile.L3{background:var(--l3);color:var(--l3t);border:0}
.tile.L0 span,.tile.L1 span,.tile.L2 span,.tile.L3 span{color:inherit;opacity:.9}
.ctx{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:#0B3B3C;color:#fff;border-radius:12px;padding:12px 14px}
.ctx label.f{color:#CFE3E1}
.ctx .hint{font-size:12px;color:#CFE3E1;max-width:420px}
details.comp{border:1px solid var(--line);border-radius:12px;background:var(--paper);overflow:hidden}
details.comp+details.comp{margin-top:8px}
details.comp>summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:10px 14px;background:var(--panel);font-weight:900}
details.comp>summary::-webkit-details-marker{display:none}
details.comp>summary .t{flex:1}
.bloc-h{margin:14px 0 6px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#B57E00;font-weight:900}
.item{border-top:1px solid var(--line)}
.item-h{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px 14px;background:color-mix(in srgb,var(--panel) 50%,var(--paper))}
.item-h .code{font-weight:900}
.item-h .lab{font-weight:700}
.badge{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:5px 10px;font-weight:900;font-size:13px;white-space:nowrap}
.badge small{font-weight:700;opacity:.85}
.crit{display:grid;grid-template-columns:64px 1fr minmax(180px,auto) auto;gap:12px;align-items:center;padding:8px 14px;border-top:1px dashed var(--line)}
.crit .code{font-size:12px;color:var(--muted);font-weight:700}
.crit .txt{font-size:14px}
.hist{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.hist button{min-height:0;padding:0;border:0;background:none}
.hist .lv{min-width:22px;height:22px;font-size:12px;border-radius:5px}

.pick{display:flex;gap:4px}
.pick{border-left:1px solid var(--line);padding-left:12px}
.pick button{min-height:34px;min-width:34px;padding:0;border-width:2px;font-weight:900;background:var(--paper)}
.pick button.L0{border-color:var(--l0);color:var(--l0)} .pick button.L1{border-color:#C79A00;color:#8A6A00} .pick button.L2{border-color:#5E9A1E;color:#3F6E10} .pick button.L3{border-color:var(--l3);color:var(--l3)}
.pick button.L0:hover{background:var(--l0);color:var(--l0t)} .pick button.L1:hover{background:var(--l1);color:var(--l1t)} .pick button.L2:hover{background:var(--l2);color:var(--l2t)} .pick button.L3:hover{background:var(--l3);color:var(--l3t)}
.best{display:inline-flex;align-items:center;justify-content:center;min-width:118px;height:30px;border-radius:7px;font-weight:900;font-size:13px;padding:0 10px;white-space:nowrap}
.hist .lv.small{min-width:20px;height:20px;font-size:11px;border-radius:4px}
.hist .arrow{color:var(--muted);font-size:12px;margin:0 2px}
.pop{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border-radius:8px;padding:8px 12px;font-size:13px}
.imports ul{list-style:none;margin:0;padding:0}
.imports li{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
ol.how{margin:6px 0 0;padding-left:20px;color:var(--muted);font-size:14px}
@media (max-width:760px){.crit{grid-template-columns:1fr;}.item-h{grid-template-columns:1fr}.who{text-align:left}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script type="application/json" id="ref" data-keep="body">[["Bloc 1 · U2 · E2", "Préparer et clôturer l'opération de transport routier", [["C1", "Collecter les informations", [["C1.1", "Recueillir les informations utiles à la mission", ["Les exigences, contraintes et conditions de prise en charge, de chargement et de déchargement liées à la marchandise à transporter, au véhicule mobilisé, à la réglementation du transport à effectuer sont identifiées", "Les conditions, les spécificités, les contraintes liées à l'itinéraire à suivre ou à planifier ainsi qu'au lieu de déchargement sont identifiées", "Les informations permettant de traiter les accidents, les incidents, les litiges sont identifiées avec soin"]], ["C1.2", "Vérifier les documents nécessaires", ["L'ensemble des documents nécessaires au transport des marchandises est présent et vérifié avec soin (pochette de documents complète, documents relatifs au véhicule, au conducteur et à la marchandise)"]]]], ["C2", "Préparer la mission de transport routier", [["C2.1", "Identifier les contraintes de la mission de transport", ["Les contraintes liées à la marchandise, au véhicule, à l'itinéraire et aux conditions de transport sont identifiées", "Les contraintes spécifiques du client sont identifiées"]], ["C2.2", "Vérifier l'adéquation du véhicule avec les marchandises à transporter", ["Le véhicule est compatible avec la marchandise à transporter en termes de carrosserie, de charge utile et dimension", "Les équipements nécessaires au transport à réaliser sont présents et compatibles"]], ["C2.3", "Préparer le ou les itinéraires", ["L'itinéraire est adapté aux contraintes liées au véhicule, aux destinations et aux conditions de circulation et météorologiques", "Les notions de temps et de coût sont prises en compte dans la définition de l'itinéraire", "L'itinéraire est optimisé en termes de kilomètres et de temps de conduite"]], ["C2.4", "Établir le plan de chargement", ["Le plan de chargement tient compte de l'ordre de livraison et/ou d'enlèvements et des impératifs des clients", "Le plan de chargement tient compte des caractéristiques des marchandises et de la répartition des charges"]]]], ["C3", "Clôturer la mission de transport routier", [["C3.1", "Renseigner et restituer les documents relatifs à son activité", ["L'ensemble des documents nécessaires au véhicule et au transport des marchandises est restitué aux services compétents (la lettre de voiture, la pochette des documents, le carnet d'entretien et les documents douaniers le cas échéant)", "Le constat amiable est restitué le cas échéant"]], ["C3.2", "Restituer le véhicule et le préparer pour une prochaine mission", ["Les opérations de fin de service du tachygraphe sont réalisées", "Le véhicule est inspecté et remis à l'état initial en fin de service dans le cadre d'une nouvelle mission", "Le véhicule est libéré de tous ses déchets en appliquant une démarche environnementale", "Les règles de sécurité et de prévention des risques sont appliquées"]], ["C3.3", "Rendre compte aux services compétents de la mission de transport", ["Les incidents, accidents, anomalies et les conséquences durant la mission sont signalés, analysés et transmis au(x) service(s) compétent(s)", "Les réserves éventuelles prises sont gérées et mises en relation avec le service d'exploitation"]]]], ["C4", "Planifier ses activités", [["C4.1", "Planifier ses temps de conduite et de repos", ["La réglementation sociale européenne, le code des transports et le code du travail sont respectés", "Les temps de conduite, de repos et de travail (chargement, déchargement…) sont planifiés de manière à être optimisés"]], ["C4.2", "Gérer ses temps de conduite et de repos en fonction des évènements et aléas", ["Les temps de conduite et de repos sont ajustés en fonction des évènements et aléas rencontrés et tiennent compte des activités déjà réalisées et à venir", "Les aménagements de la règlementation sociale européenne sont utilisés afin de garantir une durée de transport optimale"]]]]]], ["Bloc 2 · U31 · E31", "Réaliser le transport routier", [["C5", "Prendre en charge et manœuvrer le véhicule", [["C5.1", "Contrôler la conformité du véhicule et des équipements", ["Les contrôles du véhicule tracteur, de la remorque ou de la semi-remorque et du chargement sont réalisés avec précision et en totalité ; toute anomalie est signalée (présence, état, propreté des vitrages, fixation, fonctionnement des éléments : feux, dispositifs de contrôle, roues, suspensions, carrosserie, direction…)", "Toute présence de taches sous l'ensemble du véhicule est signalée", "Les dispositifs et orifices permettant de compléter les niveaux sont identifiés", "La vérification des documents de bord, des plaques du véhicule, des disques de limitation de vitesse, des dispositifs réfléchissants, des barres latérales de sécurité et anti-encastrement est réalisée sans omission et toute anomalie est signalée", "L'accès au compartiment des marchandises est réalisé en sécurité", "L'état et l'étanchéité du compartiment des marchandises sont vérifiés et toute anomalie est signalée (carrosserie endommagée, défaut étanchéité, plancher abîmé…)", "Le poids, la nature de la marchandise, la répartition, et le calage ou l'arrimage des marchandises sont vérifiés et toute anomalie est signalée", "La mise en marche du moteur est assurée en conformité", "Les voyants sont testés et les anomalies sont signalées", "Le réglage du siège, du volant et des rétroviseurs est assuré en conformité", "Le système de freinage est vérifié : mise en pression, frein de parc, frein de service"]], ["C5.2", "Réaliser un attelage / un dételage", ["La compatibilité entre le véhicule moteur et la remorque ou semi-remorque est vérifiée", "Le véhicule tracteur et la remorque ou semi-remorque sont stationnés et immobilisés de manière optimale sur un emplacement stable puis attelés et dételés en toute conformité : vérification du verrouillage ou du déverrouillage du système d'attelage, essai de traction, branchements ou débranchement des flexibles électriques, pneumatiques, béquilles et barre anti-encastrement relevées ou descendues en toute sécurité…", "Le conducteur prend en compte correctement son ensemble nouvellement constitué en termes de masses et dimensions pour circuler en sécurité dans le respect de la signalisation", "La suspension du véhicule tracteur est utilisée avec pertinence lors des opérations d'attelage / dételage et remise en position route à l'issue de l'opération"]], ["C5.3", "Effectuer les manœuvres en toute sécurité", ["Les manœuvres permettent d'assurer un stationnement sûr, dans un temps déterminé pour charger/décharger sur un quai de chargement/déchargement", "L'arrêt de précision est réalisé correctement"]], ["C5.4", "Anticiper les conditions et les risques de conduite pour un itinéraire à venir", ["Les différentes situations de conduite spécifiques pour un itinéraire à venir sont identifiées", "Les risques sont anticipés et permettent en toute connaissance d'envisager une conduite en toute sécurité"]]]], ["C6", "Conduire un véhicule de manière rationnelle et en toute sécurité", [["C6.1", "Conduire un véhicule en toute sécurité", ["L'installation au poste de conduite est réalisée en conformité et la sécurité à bord est assurée (port des ceintures de sécurité, présence d'extincteurs, gilet…)", "Les commandes et les accessoires sont utilisés de manière rationnelle", "La prise d'information en continu permet de conduire en toute sécurité", "L'allure est adaptée aux circonstances (infrastructures, météo, trafic, contextes)", "Les règles de circulation prévues par le code de la route sont appliquées", "La communication à l'égard des autres usagers est pertinente", "Les espaces de sécurité (latéraux, longitudinaux) sont maintenus", "La conduite est assurée en autonomie et en sécurité", "Le véhicule est positionné correctement sur la voie de circulation en fonction des circonstances"]], ["C6.2", "Mettre en œuvre les principes d'éco conduite et de conduite citoyenne", ["Le contexte de circulation est constamment analysé", "Le conducteur fait preuve d'anticipation", "La conduite est adaptée au type de véhicule, au profil de la route et aux différentes situations", "La communication avec les autres usagers est courtoise et relève d'une conduite citoyenne", "Les principes d'éco conduite sont mis en œuvre pour optimiser la consommation du véhicule"]]]], ["C7", "Prendre en charge et mettre à disposition la marchandise", [["C7.1", "Conduire en sécurité les engins de manutention", ["Les vérifications sont réalisées en conformité", "Les moyens de prévention collectifs et individuels sont mobilisés", "Les appareils choisis sont adaptés à l'activité prévue", "Les règles de manutention et de sécurité sont respectées", "Les anomalies constatées sont signalées"]], ["C7.2", "Contrôler la marchandise", ["La marchandise à charger est conforme à l'opération de transport", "Les anomalies sont signalées", "La lettre de voiture est correctement renseignée et validée, les réserves prises sont consignées et signées le cas échéant"]], ["C7.3", "Charger et/ou décharger, caler et arrimer la marchandise", ["Les protocoles de sécurité sont pris en compte et respectés", "Les moyens de prévention collectifs et individuels sont mobilisés", "Le calage et l'arrimage de la marchandise pour conserver son état initial sont assurés", "Les précautions sont prises lors de l'immobilisation du véhicule", "Les supports de chargement sont bien choisis (arrimage et calage particuliers : ex. fûts…)", "La répartition des charges est respectée (dimensions, équilibre, masses), le véhicule n'est pas en surcharge (essieux et véhicule)", "L'ordre de la « tournée » est réfléchi"]]]], ["C8", "Utiliser l'instrumentation de bord", [["C8.1", "Suivre un itinéraire imposé", ["L'itinéraire à suivre tient compte des contraintes liées à la destination et au véhicule", "L'itinéraire suivi est ajusté en tenant compte des conditions météorologiques", "La conduite lors de l'itinéraire suivi anticipe les franchissements de tunnels, de passages à niveaux et prend en compte les passages à proximité de chantiers routiers"]], ["C8.2", "Exploiter les moyens embarqués de conduite", ["Les outils numériques d'aide à la navigation sont programmés selon les contraintes de son véhicule", "Les outils numériques d'aide à la navigation sont programmés de manière à garantir la réalisation optimale du transport", "L'itinéraire proposé est suivi"]], ["C8.3", "Utiliser le tachygraphe", ["Le tachygraphe est mis en service et utilisé selon la réglementation en vigueur y compris en mode dégradé", "Les paramètres enregistrés sont identifiés et commentés au regard de la règlementation européenne"]]]]]], ["Bloc 3 · U32 · E32", "Gérer les risques professionnels liés au transport routier", [["C9", "Traiter les incidents, accidents, anomalies, litiges", [["C9.1", "Identifier, interpréter les dysfonctionnements liés au véhicule", ["L'allumage de voyants conduit à une analyse de causes possibles", "Le système concerné est identifié et localisé, voire réinitialisé si nécessaire", "La décision de poursuivre ou non la mission est prise à l'issue d'une analyse des risques"]], ["C9.2", "Gérer un aléa, une situation d'incident, d'accident et de contrôle routier", ["L'itinéraire est adapté en fonction d'un aléa rencontré durant le transport", "Le véhicule est immobilisé en sécurité", "Le périmètre de sécurité est établi le cas échéant", "Les incidents sont identifiés et signalés de manière professionnelle", "La signalisation de sécurité est mise en place", "Les conduites à tenir pour protéger, alerter et secourir sont mises en œuvre", "Les services d'urgence sont contactés selon la procédure en vigueur", "Les équipements de secours appropriés sont mobilisés", "Le constat amiable est renseigné avec précision et exactitude", "Les contrôles routiers sont abordés avec professionnalisme"]]]], ["C10", "Communiquer en situation professionnelle à l'oral et à l'écrit", [["C10.1", "Choisir et utiliser des outils de communication", ["Les outils de communication sont adaptés et maîtrisés (support, forme…)", "Les outils numériques sont correctement mis en œuvre"]], ["C10.2", "Identifier l'interlocuteur et les informations à transmettre", ["L'interlocuteur est parfaitement identifié", "Les informations à transmettre sont clairement identifiées, pertinentes et structurées"]], ["C10.3", "Rendre compte de sa mission, à l'écrit, à l'oral", ["Le vocabulaire utilisé pour le compte rendu écrit est pertinent", "L'expression utilisée pour le compte rendu oral est claire", "Les propos sont organisés et précis"]], ["C10.4", "Adapter la communication à son interlocuteur y compris en langue vivante étrangère", ["Le moyen de communication est adapté à son interlocuteur", "Le vocabulaire utilisé est pertinent et adapté à son interlocuteur", "L'expression écrite ou orale formulée en langue étrangère est suffisante pour être comprise"]]]], ["C11", "Appliquer les procédures relatives à la sûreté et au respect de l'environnement", [["C11.1", "Appliquer les procédures relatives à la sûreté des biens et des personnes", ["Lors d'une immobilisation sur une aire de stationnement, toutes les précautions sont prises pour préserver le véhicule et la marchandise", "La nature de la marchandise transportée ne fait l'objet d'aucune communication", "La conservation de la marchandise dans son état initial est assurée", "Le conducteur utilise les équipements de protection individuelle", "Les parties du véhicule potentiellement propices à des actes de criminalité ou à l'embarquement de clandestins sont inspectées avant la reprise de mission", "L'incident rencontré est expliqué de manière factuelle aux forces de l'ordre et/ou aux douaniers et/ou à l'entreprise"]], ["C11.2", "Identifier et trier les déchets", ["La prévention des risques liés à l'activité physique est mise en œuvre", "Les déchets et les supports de charges sont triés en fonction de leur nature en vue du recyclage", "Les supports de charge sont comptabilisés, contrôlés, restitués selon le contrat de transport", "Les dimensions de la réglementation sociale européenne sont prises en compte", "Les anomalies constatées dans les procédures de recyclage sont identifiées et explicitées au service exploitation"]]]], ["C12", "S'impliquer dans un environnement professionnel", [["C12.1", "Analyser des situations professionnelles", ["Les différentes contraintes (exploitation, client et règlementations en vigueur) sont clairement identifiées puis prises en compte de manière adaptée", "Les dysfonctionnements ou incidents (nature, causes, conséquences) en lien avec la mission sont identifiés et décrits précisément", "Les impacts humains, matériels et économiques sont clairement identifiés et pris en compte", "Le conducteur met en œuvre dans les meilleurs délais et les meilleures conditions des actions pour satisfaire la mission et démontre son sens du service", "Les bonnes pratiques sont transposées et si besoin adaptées pour résoudre des problèmes et/ou des difficultés particulières rencontrées"]], ["C12.2", "Proposer des améliorations et résoudre des problèmes", ["Des bonnes pratiques observées sont retranscrites à l'oral et/ou formalisées à l'écrit y compris dans une langue étrangère", "Des solutions, des améliorations dans la préparation, le déroulement et la clôture de missions sont proposées au(x) service(s) compétent(s), à l'oral ou formalisées à l'écrit y compris dans une langue étrangère"]]]]]]]</script>

function migrate(s){
  if(s&&s.v===2)return s;
  var n={v:2,eleves:{},recs:[],imports:[],seq:1};
  if(s&&s.imports){
    s.imports.forEach(function(imp){

function toIso(d){var m=/^(\d\d)\/(\d\d)\/(\d{4})$/.exec(d||"");return m?m[3]+"-"+m[2]+"-"+m[1]:(d||today());}
function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
function frDate(iso){var m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(iso||"");return m?m[3]+"/"+m[2]+"/"+m[1]:iso;}
function norm(s){return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[^A-Z0-9]+/g," ").trim();}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function promoOf(annee,niv){var y=parseInt(String(annee).slice(0,4),10)-NIVIDX[niv];return y+"-"+(y+3);}
function anneeOf(promo,niv){var y=parseInt(promo.slice(0,4),10)+NIVIDX[niv];return y+"-"+(y+1);}
function addEleve(st,p,nom){st.eleves[p]=st.eleves[p]||[];if(!st.eleves[p].some(function(x){return norm(x)===norm(nom);}))st.eleves[p].push(nom);}
function promos(){return Object.keys(state.eleves).sort().reverse();}
function elevesOf(p){return (state.eleves[p]||[]).slice().sort(function(a,b){return a.localeCompare(b,"fr");});}
function curSchoolYear(){var d=new Date(),y=d.getMonth()>=7?d.getFullYear():d.getFullYear()-1;return y+"-"+(y+1);}

  sAnnee:curSchoolYear(),sMat:"TP MAINTENANCE",sDate:today(),iAnnee:"",iNiv:"2",confirmDel:null};
try{var ss=sessionStorage.getItem("suivi2-ui");if(ss){var o=JSON.parse(ss);for(var k in o)ui[k]=o[k];ui.dirty=false;ui.sel=null;ui.confirmDel=null;}}catch(e){}

/* ---------- Calculs ---------- */
function filtered(promo,eleve,f){
  f=f||{};var key=norm(eleve),idx={};
  state.recs.forEach(function(r){
    if(r[0]!==promo||norm(r[1])!==key)return;
    if(f.annee&&r[2]!==f.annee)return;
    if(f.matiere&&r[4]!==f.matiere)return;
    (idx[r[5]]=idx[r[5]]||[]).push(r);
  });
  return idx;
}
function best(idx,code){var a=idx[code];if(!a)return null;var m=-1;a.forEach(function(r){if(r[6]>m)m=r[6];});return m;}
function itemInfo(idx,I){
  var ls=[];I.crits.forEach(function(k){var b=best(idx,k.code);if(b!=null)ls.push(b);});
  if(ls.length){var mean=ls.reduce(function(s,x){return s+x;},0)/ls.length;return{l:Math.round(mean),mean:mean,n:ls.length,N:I.crits.length,direct:false};}
  var d=best(idx,I.code);if(d!=null)return{l:d,mean:d,n:0,N:I.crits.length,direct:true};
  return null;
}
function compInfo(idx,C){
  var ls=[];C.items.forEach(function(I){var x=itemInfo(idx,I);if(x)ls.push(x.mean);});
  if(!ls.length)return null;var mean=ls.reduce(function(s,x){return s+x;},0)/ls.length;return{l:Math.round(mean),mean:mean,n:ls.length,N:C.items.length};
}
function dec(x){return (Math.round(x*10)/10).toString().replace(".",",");}
function lv(l,txt,title){var c=l==null?"LZ":"L"+l;return '<span class="lv '+c+'"'+(title?' title="'+esc(title)+'"':"")+'>'+(txt!=null?txt:(l==null?"–":l))+'</span>';}
function matieres(promo){var m={};MAT_DEF.forEach(function(x){m[x]=1;});state.recs.forEach(function(r){if(!promo||r[0]===promo)m[r[4]]=1;});return Object.keys(m).sort();}
function anneesOf(promo){var a={};state.recs.forEach(function(r){if(r[0]===promo)a[r[2]]=r[3];});return Object.keys(a).sort().map(function(k){return[k,a[k]];});}

function legend(){return '<div class="legend">'+LV.map(function(L){return '<span class="lg">'+lv(L.n)+esc(L.lab)+'</span>';}).join("")+'<span class="lg">'+lv(null)+ZLAB+'</span></div>';}

  if(ps.length)h+=sel("f-promo","Promotion",ps.map(function(p){return[p,"Promotion "+p];}),ui.promo);
  h+='</div><div class="row">'+saveBar();
  if(ps.length)h+='<button id="b-xlsx">Exporter en Excel</button>';
  h+='</div></div>';
  if(ui.msg)h+='<div class="'+(ui.msg.t==="err"?"err":"note")+'" role="status">'+ui.msg.s+'</div>';
  h+=legend();
  h+='<nav class="tabs" role="tablist">'+[["classe","Classe"],["eleve","Élève : saisie et fiche"],["imports","Imports PRONOTE"]].map(function(t){return '<button role="tab" data-tab="'+t[0]+'" aria-selected="'+(ui.tab===t[0])+'">'+t[1]+'</button>';}).join("")+'</nav>';

  else if(ui.mode==="item")ITEMS.forEach(function(I){h+='<th class="'+(I.comp.items[0]===I?"sep":"")+'" title="'+esc(I.code+" "+I.label)+'">'+I.code.split(".")[1]+'</th>';});

  h+='</tr></thead><tbody>';
  var foot=cols.map(function(){return 0;});

    var idx=filtered(ui.promo,nom,f),dist=[0,0,0,0,0];
    var infos=ITEMS.map(function(I){var x=itemInfo(idx,I);dist[x?x.l:4]++;return x;});

    if(ui.mode==="crit")CRITS.forEach(function(K,x){var b=best(idx,K.code);if(b!=null&&b>=2)foot[x]++;h+='<td class="c'+(K.num===1?" sep":"")+'" data-eleve="'+esc(nom)+'">'+lv(b,null,K.code+" : "+(b==null?ZLAB:LV[b].lab))+'</td>';});
    else if(ui.mode==="item")ITEMS.forEach(function(I,x){var i=infos[x];if(i&&i.l>=2)foot[x]++;h+='<td class="c'+(I.comp.items[0]===I?" sep":"")+'" data-eleve="'+esc(nom)+'">'+lv(i?i.l:null,null,I.code+" "+I.label+" — "+(i?LV[i.l].lab+(i.direct?" (PRONOTE, sans détail des critères)":" · moyenne "+dec(i.mean)+" sur "+i.n+"/"+i.N+" critères évalués"):ZLAB))+'</td>';});
    else COMPS.forEach(function(C,x){var c=compInfo(idx,C);if(c&&c.l>=2)foot[x]++;h+='<td class="c sep" data-eleve="'+esc(nom)+'">'+lv(c?c.l:null,null,C.code+" "+C.label+" — "+(c?LV[c.l].lab+" · moyenne "+dec(c.mean)+" ("+c.n+"/"+c.N+" sous-compétences)":ZLAB))+'</td>';});
    h+='<td class="sep"><div class="dist" title="'+esc("Très bonne : "+dist[3]+" · Satisfaisante : "+dist[2]+" · Fragile : "+dist[1]+" · Insuffisante : "+dist[0]+" · Non évaluées : "+dist[4])+'">'+[3,2,1,0].map(function(l){return dist[l]?'<span class="L'+l+'" style="width:'+(dist[l]/33*100)+'%"></span>':"";}).join("")+'</div></td></tr>';
  });
  h+='</tbody><tfoot><tr><td class="name">Élèves au niveau 2 ou 3</td>';
  foot.forEach(function(n,x){var sep=ui.mode==="crit"?CRITS[x].num===1:ui.mode==="item"?ITEMS[x].comp.items[0]===ITEMS[x]:true;h+='<td class="'+(sep?"sep":"")+'">'+n+'</td>';});
  h+='<td class="sep"></td></tr></tfoot></table></div>';

function eleveCur(){var els=elevesOf(ui.promo);if(!els.length)return null;var e=els.filter(function(x){return norm(x)===norm(ui.eleve);})[0];if(!e){e=els[0];ui.eleve=e;}return e;}
function viewEleve(){
  if(!ui.promo)return '<div class="panel">Aucun élève. Faites d\'abord un import PRONOTE.</div>';
  var els=elevesOf(ui.promo),nom=eleveCur(),i=els.indexOf(nom);
  var idx=filtered(ui.promo,nom),dist=[0,0,0,0,0],nc=0;
  ITEMS.forEach(function(I){var x=itemInfo(idx,I);dist[x?x.l:4]++;});
  CRITS.forEach(function(K){if(best(idx,K.code)!=null)nc++;});
  var h='<div class="row spread"><div class="row"><button id="b-prev" class="ghost" '+(i<=0?"disabled":"")+' aria-label="Élève précédent">◀</button>'+sel("f-el","Élève",els.map(function(x){return[x,x];}),nom)+'<button id="b-next" class="ghost" '+(i>=els.length-1?"disabled":"")+' aria-label="Élève suivant">▶</button></div><button id="b-pdf" class="primary">Fiche de l\'élève en PDF</button></div>';
  h+='<div class="tiles">'+[3,2,1,0].map(function(l){return '<div class="tile L'+l+'"><b>'+dist[l]+'</b><span>sous-compétences — '+LV[l].lab.toLowerCase()+'</span></div>';}).join("")+'<div class="tile"><b>'+dist[4]+'</b><span>sous-compétences non évaluées</span></div><div class="tile"><b>'+nc+'<small style="font-size:16px">/122</small></b><span>critères évalués au moins une fois</span></div></div>';
  var ans=[];var y=parseInt(ui.promo.slice(0,4),10);for(var k=0;k<3;k++)ans.push([(y+k)+"-"+(y+k+1),NIV[k][1]+" · "+(y+k)+"-"+(y+k+1)]);
  if(!ans.some(function(a){return a[0]===ui.sAnnee;}))ui.sAnnee=ans.filter(function(a){return a[0]===curSchoolYear();})[0]?curSchoolYear():ans[0][0];
  h+='<div class="ctx">'+sel("s-an","Année de l'évaluation",ans,ui.sAnnee)+sel("s-mat","Matière",matieres(ui.promo).map(function(m){return[m,m];}),ui.sMat)+'<label class="f" for="s-date">Date<input type="date" id="s-date" value="'+esc(ui.sDate)+'"></label><span class="hint">Cliquez sur 0, 1, 2 ou 3 en face d\'un critère pour enregistrer une évaluation dans ce contexte. Cliquez sur un carré de l\'historique pour le voir ou le supprimer.</span></div>';
  BLOCS.forEach(function(B){
    h+='<div class="bloc-h">'+esc(B.label+" — "+B.title)+'</div>';
    B.comps.forEach(function(C){
      var ci=compInfo(idx,C),open=ui.open[C.code]!==false;
      h+='<details class="comp" data-comp="'+C.code+'"'+(open?" open":"")+'><summary><span class="t">'+C.code+' — '+esc(C.label)+'</span>'+badge(ci,"sous-compétences")+'</summary>';

        var ii=itemInfo(idx,I),direct=(idx[I.code]||[]);
        h+='<div class="item"><div class="item-h"><span class="code">'+I.code+'</span><span class="lab">'+esc(I.label)+(direct.length?' <span class="hist" style="display:inline-flex;vertical-align:middle">'+direct.map(chip).join("")+'</span>':'')+'</span>'+badge(ii,"critères")+'</div>';
        if(ui.sel&&direct.some(function(r){return r[10]===ui.sel;}))h+=pop();
        I.crits.forEach(function(K){
          var rs=(idx[K.code]||[]).slice().sort(function(a,b){return a[8]<b[8]?-1:1;}),b=best(idx,K.code);
          h+='<div class="crit"><span class="code">Critère '+K.num+'</span><span class="txt">'+esc(K.label)+'</span><span class="hist">'+(rs.length?rs.map(chip).join("")+'<span class="arrow" aria-hidden="true">→</span>':'')+'<span class="best '+(b==null?"LZ":"L"+b)+'" title="Niveau retenu (meilleur niveau)">'+(b==null?ZLAB:b+" · "+esc(LV[b].short))+'</span></span><span class="pick">'+LV.map(function(L){return '<button class="L'+L.n+'" data-add="'+K.code+'" data-l="'+L.n+'" title="'+esc(L.lab)+'"'+(readOnly?" disabled":"")+'>'+L.n+'</button>';}).join("")+'</span>';
          if(ui.sel&&rs.some(function(r){return r[10]===ui.sel;}))h+=pop();
          h+='</div>';
        });
        h+='</div>';
      });
      h+='</details>';
    });
  });
  return h;
}

    h+='</li>';});h+='</ul>';}
  h+='</div><div class="panel"><h2 style="margin:0 0 6px;font-size:18px">Ajouter un élève à la main</h2><div class="row">'+sel("a-promo","Promotion",promosPlus(),ui.promo||promoOf(curSchoolYear(),"2"))+'<label class="f" for="a-nom">NOM Prénom<input type="text" id="a-nom" placeholder="DUPONT Léa"></label><button id="a-go"'+(readOnly?" disabled":"")+'>Ajouter</button></div></div>';

/* ---------- Enregistrement ---------- */
function keepUi(){try{ui.scrollY=window.scrollY;sessionStorage.setItem("suivi2-ui",JSON.stringify(ui));}catch(e){}}
function changed(msg){
  ui.dirty=true;if(msg)ui.msg={t:"note",s:msg};render();
  clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,4000);
}
function buildHtml(){
  var S="<"+"script",E="<"+"/script>";
  var head=Array.prototype.map.call(document.querySelectorAll('[data-keep="head"]'),function(n){return n.outerHTML;}).join("\n");
  var body=Array.prototype.map.call(document.querySelectorAll('[data-keep="body"]'),function(n){return n.outerHTML;});
  var refLogo=body.slice(0,2).join("\n"),rest=body.slice(2).join("\n");
  return '<!DOCTYPE html>\n<html lang="fr">\n<head>\n'+head+'\n<title>'+TITLE+'</title>\n'+refLogo+'\n</head>\n<body>\n<header class="top"><div class="top-in" id="topbar"></div></header>\n<main class="wrap" id="root"><p class="status">Chargement…</p></main>\n'+S+' type="application/json" id="state">'+JSON.stringify(state).replace(/</g,"\\u003c")+E+'\n'+rest+'\n</body>\n</html>\n';
}
function saveNow(){
  clearTimeout(saveTimer);if(!ui.dirty)return;
  if(!artifactCap){
    try{localStorage.setItem("suivi2-local",JSON.stringify(state));}catch(e){}
    ui.dirty=false;render();return;
  }
  ui.dirty=false;ui.msg=null;keepUi();
  artifactCap.publish(buildHtml()).catch(function(e){
    var c=e&&e.code;if(c==="conflict")return;
    if(c==="not_writer"||c==="not_granted"||c==="consent_required"||c==="capability_disabled"){readOnly=true;ui.msg={t:"err",s:"Lecture seule : seul le propriétaire ou un éditeur peut enregistrer des saisies."};}
    else{ui.dirty=true;ui.msg={t:"err",s:"L'enregistrement a échoué ("+esc(c||"erreur")+"). Cliquez sur « Enregistrer maintenant » pour réessayer."};}
    render();
  });
}

/* ---------- Import PDF ---------- */
var BARCOL=[[248,10,10],[255,218,1],[69,184,81],[0,128,0]];

function pageRows(pg){
  var O=window.pdfjsLib.OPS;
  return Promise.all([pg.getTextContent(),pg.getOperatorList()]).then(function(res){
    var tc=res[0],ol=res[1],rows={};
    tc.items.forEach(function(it){if(!it.str||!it.str.trim())return;var y=it.transform[5],k=Math.round(y/2);(rows[k]=rows[k]||{y:y,p:[]}).p.push({x:it.transform[4],s:it.str});});
    var ctm=[1,0,0,1,0,0],stack=[],fill=[0,0,0],bars={};
    for(var i=0;i<ol.fnArray.length;i++){
      var f=ol.fnArray[i],a=ol.argsArray[i];
      if(f===O.save)stack.push(ctm.slice());

            var y1=ctm[1]*x+ctm[3]*y+ctm[5],y2=ctm[1]*(x+w)+ctm[3]*(y+h)+ctm[5],x1=ctm[0]*x+ctm[2]*y+ctm[4],x2=ctm[0]*(x+w)+ctm[2]*(y+h)+ctm[4],yc=(y1+y2)/2,key=Math.round(yc);
            var B=bars[key]||(bars[key]={yc:yc,w:[0,0,0,0]});B.w[lvl]+=Math.abs(x2-x1);}
          else if(op===O.moveTo||op===O.lineTo)j+=2;else if(op===O.curveTo)j+=6;else if(op===O.curveTo2||op===O.curveTo3)j+=4;
        }
      }
    }
    var barList=Object.keys(bars).map(function(k){return bars[k];});
    return Object.keys(rows).map(function(k){return rows[k];}).sort(function(a,b){return b.y-a.y;}).map(function(r){
      var t=r.p.sort(function(a,b){return a.x-b.x;}).map(function(o){return o.s;}).join(" ").replace(/\s+/g," ").trim(),bar=null,dmin=8;
      barList.forEach(function(B){var d=Math.abs(B.yc-(r.y+3));if(d<dmin){dmin=d;bar=B;}});
      var lvl=null;if(bar){for(var l=3;l>=0;l--)if(bar.w[l]>0.3){lvl=l;break;}}

function pdfLines(buf){
  var lib=window.pdfjsLib;if(!lib)return Promise.reject(new Error("Le lecteur de PDF n'a pas pu se charger. Rechargez la page."));

  return lib.getDocument({data:buf}).promise.then(function(pdf){
    var out=[],p=Promise.resolve();
    for(var n=1;n<=pdf.numPages;n++){(function(n){p=p.then(function(){return pdf.getPage(n);}).then(pageRows).then(function(rs){out=out.concat(rs);out.push({t:"\f",lvl:null});});})(n);}
    return p.then(function(){return out;});

function parsePdf(lines){
  var res={eleves:[],periode:"",ref:"",warn:[],total:0,colors:0},by={},cur=null,mode=null,mat=null,item=null,itemLvl=null,chunks=[],expect=false;
  function lvlOr(l){return l!=null?l:(mode===2?2:1);}
  function flush(){
    if(!cur||!item||mode===null){chunks=[];return;}
    var I=ITEM_BY[item],done=0;
    chunks.forEach(function(c){
      var txt=norm(c.t),hit=[];if(!txt)return;
      I.crits.forEach(function(K){var key=norm(K.label).slice(0,40);if(key&&txt.indexOf(key)>=0)hit.push(K.code);});
      if(!hit.length)I.crits.forEach(function(K){var w=norm(K.label).split(" ").filter(function(x){return x.length>3;}),ok=w.filter(function(x){return txt.indexOf(x)>=0;}).length;if(w.length&&ok/w.length>0.8)hit.push(K.code);});
      hit.forEach(function(code){cur.r.push([mat,code,lvlOr(c.lvl)]);done++;if(c.lvl!=null)res.colors++;});
    });
    if(!done){cur.r.push([mat,item,lvlOr(itemLvl)]);if(itemLvl!=null)res.colors++;}
    chunks=[];
  }
  lines.forEach(function(row){
    var l=row.t;
    if(l==="\f"){flush();item=null;expect=false;return;}
    if(/^Liste des compétences$/i.test(l)){flush();item=null;expect=true;return;}
    if(/^LYCEE|Index Education|^Items|Évaluations$/i.test(l)&&!/^C\d/.test(l))return;
    if(expect){expect=false;var parts=l.split(" - ");if(parts.length>=3){var nom=parts[0].trim(),k=norm(nom);res.periode=parts.slice(1,-1).join(" - ").trim();res.ref=parts[parts.length-1].trim();if(!by[k]){by[k]={n:nom,r:[]};res.eleves.push(by[k]);}cur=by[k];mode=null;mat=null;item=null;return;}}
    var m=l.match(/^Compétences (non )?maîtrisées\s*:\s*(\d+)/i);
    if(m){flush();item=null;mode=m[1]?1:2;mat=null;return;}
    if(!cur||mode===null)return;
    m=l.match(/^(C\d{1,2}\.\d{1,2})\b/);
    if(m){flush();item=ITEM_BY[m[1]]?m[1]:null;itemLvl=row.lvl;return;}
    if(/^C\d{1,2}\s/.test(l)){flush();item=null;return;}
    m=l.match(/^(.+?)\s*\((\d+)\)$/);
    if(m&&!item){mat=m[1].trim();return;}
    if(m&&item&&/^[A-Z0-9 .'’-]+$/.test(m[1])){flush();item=null;mat=m[1].trim();return;}
    if(item){if(row.lvl!=null||!chunks.length)chunks.push({t:l,lvl:row.lvl});else chunks[chunks.length-1].t+=" "+l;}
  });

  res.eleves.forEach(function(e){res.total+=e.r.length;});
  if(!res.colors&&res.total)res.warn.push("Aucune couleur de niveau n'a été lue dans ce PDF : les résultats sont rangés au niveau 2 (maîtrisé) ou 1 (non maîtrisé).");
  if(res.ref&&!/conducteur routier/i.test(res.ref))res.warn.push("Ce PDF concerne « "+esc(res.ref)+" », pas le Bac Pro Conducteur routier de marchandises.");
  if(res.periode&&!/toutes les évaluations/i.test(res.periode))res.warn.push("PDF généré sur « "+esc(res.periode)+" » : avec « Toutes les évaluations », les CCF et évaluations hors période seraient aussi comptés.");
  return res;
}
function doImport(){
  var f=document.getElementById("i-file").files[0],annee=document.getElementById("i-an").value,niv=document.getElementById("i-niv").value;
  ui.iAnnee=annee;ui.iNiv=niv;
  if(!f){ui.msg={t:"err",s:"Choisissez d'abord le fichier PDF généré par PRONOTE."};render();return;}
  ui.msg={t:"note",s:"Lecture du PDF…"};render();
  f.arrayBuffer().then(pdfLines).then(function(lines){
    var r=parsePdf(lines);
    if(!r.eleves.length){ui.msg={t:"err",s:"Aucun élève trouvé. Il faut le PDF « Liste des compétences » généré depuis Compétences › Suivi des compétences."};render();return;}
    var p=promoOf(annee,niv),old=state.imports.filter(function(i){return i.annee===annee&&i.niveau===niv;}).map(function(i){return i.id;});
    state.recs=state.recs.filter(function(x){return old.indexOf(x[9])<0;});
    state.imports=state.imports.filter(function(i){return old.indexOf(i.id)<0;});
    var id="i"+Date.now().toString(36),d=today(),n=0;
    r.eleves.forEach(function(e){addEleve(state,p,e.n);e.r.forEach(function(x){state.recs.push([p,e.n,annee,niv,x[0],x[1],x[2],"P",d,id,"r"+(state.seq++)]);n++;});});
    state.imports.push({id:id,annee:annee,niveau:niv,promo:p,fichier:f.name,date:d,periode:r.periode,nbE:r.eleves.length,nbL:n});
    ui.promo=p;ui.tab="classe";ui.annee="";ui.matiere="";
    changed(r.eleves.length+" élèves et "+n+" résultats importés, dont "+r.colors+" avec leur couleur de niveau ("+(NIV[NIVIDX[niv]][1])+" · "+annee+")."+(r.warn.length?" "+r.warn.join(" "):""));
  }).catch(function(e){ui.msg={t:"err",s:esc((e&&e.message)||"Le fichier n'a pas pu être lu.")};render();});
}

  matrixSheet(wb,logoId,"Critères","crit",p,f);
  matrixSheet(wb,logoId,"Compétences","comp",p,f);

  elevesOf(p).forEach(function(nom){eleveSheet(wb,logoId,p,nom,used);});
  var hs=wb.addWorksheet("Historique",{views:[{state:"frozen",ySplit:1}]});
  hs.columns=[{header:"Élève",key:"e",width:28},{header:"Année",key:"a",width:11},{header:"Classe",key:"n",width:8},{header:"Matière",key:"m",width:22},{header:"Code",key:"c",width:10},{header:"Intitulé",key:"t",width:70},{header:"Niveau",key:"l",width:8},{header:"Libellé du niveau",key:"ll",width:22},{header:"Source",key:"s",width:16},{header:"Date",key:"d",width:11}];
  state.recs.filter(function(x){return x[0]===p;}).sort(function(a,b){return a[1]<b[1]?-1:a[1]>b[1]?1:a[8]<b[8]?-1:1;}).forEach(function(x){var K=CRIT_BY[x[5]],I=ITEM_BY[x[5]];var row=hs.addRow({e:x[1],a:x[2],n:NIV[NIVIDX[x[3]]][1],m:x[4],c:x[5],t:K?K.label:I?I.label:"",l:x[6],ll:LV[x[6]].lab,s:x[7]==="P"?"Import PRONOTE":"Saisie appli",d:frDate(x[8])});lvStyle(row.getCell(7),x[6]);});
  hs.getRow(1).eachCell(function(c){c.font={bold:true,color:{argb:XL.white}};c.fill=fill(XL.ink);});
  hs.autoFilter={from:"A1",to:"J1"};
  var rs=wb.addWorksheet("Référentiel",{views:[{state:"frozen",ySplit:1}]});
  rs.columns=[{header:"Code",key:"c",width:12},{header:"Intitulé",key:"t",width:110},{header:"Bloc",key:"b",width:22}];
  BLOCS.forEach(function(B){B.comps.forEach(function(C){var r1=rs.addRow({c:C.code,t:C.label,b:B.label});r1.font={bold:true};r1.getCell(1).fill=fill("FFD9E8E6");r1.getCell(2).fill=fill("FFD9E8E6");C.items.forEach(function(I){var r2=rs.addRow({c:I.code,t:I.label,b:B.label});r2.getCell(1).font={bold:true};r2.getCell(2).font={bold:true};I.crits.forEach(function(K){var r3=rs.addRow({c:K.code,t:K.label,b:B.label});r3.getCell(2).alignment={wrapText:true};});});});});
  rs.getRow(1).eachCell(function(c){c.font={bold:true,color:{argb:XL.white}};c.fill=fill(XL.ink);});
  wb.xlsx.writeBuffer().then(function(buf){

    deliver(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),"Suivi_competences_CRM_promo_"+p+".xlsx");
  }).catch(function(e){ui.msg={t:"err",s:"Création du fichier Excel impossible : "+esc(e&&e.message)};render();});
}

/* ---------- Fiche PDF ---------- */
function rgb(h){return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function pdfFiche(){
  if(!window.jspdf||!window.jspdf.jsPDF){ui.msg={t:"err",s:"Le module PDF n'a pas pu se charger. Rechargez la page."};render();return;}
  var nom=eleveCur(),p=ui.promo,idx=filtered(p,nom);
  var doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"}),W=210;
  function head(){
    if(LOGO)try{doc.addImage(LOGO,"PNG",12,9,20,18.5);}catch(e){}
    doc.setTextColor(11,59,60);doc.setFont("helvetica","bold");doc.setFontSize(14);doc.text("Fiche de suivi des compétences",36,14);
    doc.setFontSize(11);doc.text(nom,36,20);
    doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(54,91,91);
    doc.text("Bac Pro Conducteur routier de marchandises · référentiel 2025 · promotion "+p,36,25);
    doc.text(SCHOOL,W-12,11,{align:"right"});doc.setFont("helvetica","bold");doc.text(AUTHOR,W-12,15.5,{align:"right"});doc.setFont("helvetica","normal");doc.text(ROLE,W-12,19.5,{align:"right"});
  }
  head();
  var x=12,y=32;doc.setFontSize(8);
  LV.forEach(function(L){var c=rgb(L.fill);doc.setFillColor(c[0],c[1],c[2]);doc.roundedRect(x,y-3.2,5,4.4,0.8,0.8,"F");var t=rgb(L.font);doc.setTextColor(t[0],t[1],t[2]);doc.setFont("helvetica","bold");doc.text(String(L.n),x+2.5,y,{align:"center"});doc.setTextColor(40,40,40);doc.setFont("helvetica","normal");doc.text(L.lab,x+6.5,y);x+=6.5+doc.getTextWidth(L.lab)+5;});
  doc.setFillColor(233,239,238);doc.roundedRect(x,y-3.2,5,4.4,0.8,0.8,"F");doc.setTextColor(40,40,40);doc.text(ZLAB,x+6.5,y);
  doc.setFontSize(7.5);doc.setTextColor(95,111,110);doc.text("Niveau retenu = meilleur niveau obtenu sur les 3 ans pour chaque critère ; une sous-compétence prend la moyenne de ses critères évalués. Édité le "+frDate(today())+".",12,38);
  var body=[],meta=[];
  BLOCS.forEach(function(B){
    body.push([{content:B.label+" — "+B.title,colSpan:4}]);meta.push({t:"bloc"});
    B.comps.forEach(function(C){var ci=compInfo(idx,C);body.push([C.code,C.label,ci?ci.l+" · "+LV[ci.l].short:ZLAB,ci?"moy. "+dec(ci.mean):""]);meta.push({t:"comp",l:ci?ci.l:null});
      C.items.forEach(function(I){var ii=itemInfo(idx,I);body.push([I.code,I.label,ii?ii.l+" · "+LV[ii.l].short:ZLAB,ii?(ii.direct?"PRONOTE":"moy. "+dec(ii.mean)+" · "+ii.n+"/"+ii.N):""]);meta.push({t:"item",l:ii?ii.l:null});
        I.crits.forEach(function(K){var b=best(idx,K.code),n=(idx[K.code]||[]).length;body.push(["  "+K.num,K.label,b==null?ZLAB:b+" · "+LV[b].short,n?n+" éval.":""]);meta.push({t:"crit",l:b});});
      });
    });
  });
  doc.autoTable({startY:41,head:[["Code","Compétence · sous-compétence · critère d'évaluation","Niveau retenu","Détail"]],body:body,theme:"grid",
    styles:{font:"helvetica",fontSize:7.6,cellPadding:1.3,lineColor:[201,220,218],lineWidth:0.15,textColor:[30,42,42],valign:"middle"},
    headStyles:{fillColor:[11,59,60],textColor:255,fontStyle:"bold"},
    columnStyles:{0:{cellWidth:14},1:{cellWidth:118},2:{cellWidth:30,halign:"center",fontStyle:"bold"},3:{cellWidth:24,halign:"center",fontSize:7}},
    margin:{left:12,right:12,top:32,bottom:14},
    didParseCell:function(d){if(d.section!=="body")return;var m=meta[d.row.index];
      if(m.t==="bloc"){d.cell.styles.fillColor=[11,59,60];d.cell.styles.textColor=255;d.cell.styles.fontStyle="bold";return;}
      if(m.t==="comp"&&d.column.index!==2){d.cell.styles.fillColor=[217,232,230];d.cell.styles.fontStyle="bold";}
      if(m.t==="item"&&d.column.index!==2){d.cell.styles.fillColor=[243,248,247];d.cell.styles.fontStyle="bold";}
      if(d.column.index===2){if(m.l==null){d.cell.styles.fillColor=[233,239,238];d.cell.styles.textColor=[122,138,136];d.cell.styles.fontStyle="normal";}else{d.cell.styles.fillColor=rgb(LV[m.l].fill);d.cell.styles.textColor=rgb(LV[m.l].font);}}
    },
    didDrawPage:function(){var n=doc.internal.getNumberOfPages();if(n>1&&doc.internal.getCurrentPageInfo().pageNumber>1)head();}
  });
  var fy=doc.lastAutoTable.finalY+10;if(fy>270){doc.addPage();head();fy=40;}
  doc.setFontSize(9);doc.setTextColor(11,59,60);doc.setFont("helvetica","bold");doc.text("Signature du professeur",14,fy);doc.text("Signature de l'élève",110,fy);
  var tp=doc.internal.getNumberOfPages();for(var i=1;i<=tp;i++){doc.setPage(i);doc.setFont("helvetica","normal");doc.setFontSize(7);doc.setTextColor(95,111,110);doc.text(AUTHOR+" — "+ROLE,12,290);doc.text("Page "+i+" / "+tp,W-12,290,{align:"right"});}
  deliver(doc.output("blob"),"Fiche_competences_"+fileSafe(nom)+"_"+p+".pdf");
}

/* ---------- Événements ---------- */
var root=document.getElementById("root");
root.addEventListener("click",function(ev){
  var t=ev.target.closest("button,a,td.c");if(!t)return;
  if(t.dataset.tab){ui.tab=t.dataset.tab;ui.msg=null;ui.sel=null;render();window.scrollTo(0,0);return;}
  if(t.dataset.eleve){ui.eleve=t.dataset.eleve;ui.tab="eleve";ui.sel=null;render();window.scrollTo(0,0);return;}
  if(t.id==="b-xlsx"){exportXlsx();return;}
  if(t.id==="b-pdf"){pdfFiche();return;}
  if(t.id==="b-save"){saveNow();return;}
  if(t.id==="b-bk"){backupFile();return;}

  if(t.id==="b-prev"||t.id==="b-next"){var els=elevesOf(ui.promo),i=els.indexOf(eleveCur())+(t.id==="b-prev"?-1:1);if(els[i]){ui.eleve=els[i];ui.sel=null;render();}return;}
  if(t.dataset.add){
    if(readOnly)return;var y=parseInt(ui.promo.slice(0,4),10),niv=NIV[Math.max(0,Math.min(2,parseInt(ui.sAnnee.slice(0,4),10)-y))][0];
    state.recs.push([ui.promo,eleveCur(),ui.sAnnee,niv,ui.sMat,t.dataset.add,parseInt(t.dataset.l,10),"S",ui.sDate||today(),null,"r"+(state.seq++)]);
    changed(null);return;
  }
  if(t.dataset.rec){ui.sel=ui.sel===t.dataset.rec?null:t.dataset.rec;render();return;}
  if(t.dataset.closepop){ui.sel=null;render();return;}
  if(t.dataset.delrec){var id=t.dataset.delrec;state.recs=state.recs.filter(function(x){return x[10]!==id;});ui.sel=null;changed("Évaluation supprimée.");return;}
  if(t.id==="i-go"){doImport();return;}
  if(t.dataset.delimp){ui.confirmDel=t.dataset.delimp;render();return;}
  if(t.dataset.delimpNo){ui.confirmDel=null;render();return;}
  if(t.dataset.delimpYes){var d=t.dataset.delimpYes;state.imports=state.imports.filter(function(i){return i.id!==d;});state.recs=state.recs.filter(function(x){return x[9]!==d;});ui.confirmDel=null;changed("Import supprimé.");return;}
  if(t.id==="a-go"){var nm=(document.getElementById("a-nom").value||"").trim(),pp=document.getElementById("a-promo").value;if(!nm){ui.msg={t:"err",s:"Saisissez le nom et le prénom de l'élève."};render();return;}addEleve(state,pp,nm);ui.promo=pp;changed(esc(nm)+" ajouté à la promotion "+pp+".");return;}
});
root.addEventListener("change",function(ev){
  var t=ev.target,m={"f-promo":"promo","f-an":"annee","f-mat":"matiere","f-mode":"mode","f-el":"eleve","s-an":"sAnnee","s-mat":"sMat","s-date":"sDate","i-an":"iAnnee","i-niv":"iNiv"}[t.id];
  if(!m)return;ui[m]=t.value;if(t.id==="f-promo"){ui.annee="";ui.matiere="";}
  if(/^f-/.test(t.id))render();else keepUi();
});
root.addEventListener("toggle",function(ev){var d=ev.target;if(d.dataset&&d.dataset.comp){ui.open[d.dataset.comp]=d.open;keepUi();}},true);
window.addEventListener("scroll",function(){ui.scrollY=window.scrollY;},{passive:true});
window.addEventListener("beforeunload",function(){keepUi();});

/* ---------- Sauvegarde / restauration (appli installable) ---------- */
function backupFile(){saveNow();deliver(new Blob([JSON.stringify({app:"suivi-competences-crm",date:new Date().toISOString(),state:state})],{type:"application/json"}),"Sauvegarde_suivi_competences_"+today()+".json");}
(function(){var f=document.createElement("input");f.type="file";f.id="f-rs";f.accept=".json,application/json";f.hidden=true;document.body.appendChild(f);
f.addEventListener("change",function(){var file=f.files[0];if(!file)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);var st=d&&d.state?d.state:d;st=migrate(st);if(!st||!st.recs)throw 0;
if(state.recs.length&&!confirm("Remplacer les données de cet appareil ("+state.recs.length+" résultats) par celles de la sauvegarde ("+st.recs.length+" résultats) ?")){f.value="";return;}
state=st;ui.promo=null;ui.dirty=true;saveNow();ui.msg={t:"note",s:"Sauvegarde restaurée : "+st.recs.length+" résultats."};render();}catch(e){ui.msg={t:"err",s:"Fichier de sauvegarde non reconnu."};render();}f.value="";};r.readAsText(file);});})();

document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")saveNow();});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
window.__suivi={state:function(){return state;},parsePdf:parsePdf,pdfLines:pdfLines,buildHtml:buildHtml,exportXlsx:exportXlsx,pdfFiche:pdfFiche};

topbar();render();
