<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conduite de chariot — Val Moré</title>
<meta name="theme-color" content="#1E3C6E">
<meta name="description" content="Conduite de chariot catégories 1A et 3 (R489) – examen pratique sur tablette, résultats et attestations – Lycée du Val Moré – Freddy ROBERT">
<link rel="manifest" href="manifest.json?v=1">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#1E3C6E;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #app{position:fixed;left:0;right:0;bottom:0;top:calc(48px + env(safe-area-inset-top));width:100%;height:calc(100% - 48px - env(safe-area-inset-top));border:0;background:#fff;display:none}
  #setup{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
  .card{background:#fff;border-radius:16px;max-width:480px;width:100%;padding:24px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
  .card img{width:72px;height:72px;border-radius:14px;display:block;margin:0 auto 12px}
  h1{font-size:1.25rem;text-align:center;margin:0 0 4px;color:#1E3C6E}
  .sub{text-align:center;color:#555;font-size:.85rem;margin:0 0 18px}
  label{font-weight:600;font-size:.9rem;color:#1E3C6E}
  input{width:100%;box-sizing:border-box;margin:6px 0 14px;padding:12px;border:2px solid #c8d3e6;border-radius:10px;font-size:.95rem}
  button{border:0;border-radius:10px;padding:12px 16px;font-size:1rem;font-weight:700;cursor:pointer}
  .primary{background:#1E3C6E;color:#fff;width:100%}
  .err{color:#c62828;font-size:.85rem;min-height:1.2em;margin:-6px 0 10px}
  .sign{text-align:center;color:#777;font-size:.75rem;margin-top:16px}
  #menu{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:10;display:none;gap:8px}
  #menu button{width:42px;height:42px;padding:0;border-radius:50%;background:rgba(15,42,92,.85);color:#fff;font-size:1.1rem;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  #offline{position:fixed;top:0;left:0;right:0;background:#c62828;color:#fff;text-align:center;padding:8px;font-size:.85rem;display:none;z-index:20}
  #tabs{position:fixed;top:0;left:0;right:0;height:calc(48px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);display:none;gap:4px;align-items:center;padding-left:8px;background:#1E3C6E;overflow-x:auto;box-sizing:border-box}
  #tabs button{background:transparent;color:#cfd9ec;border-radius:10px;padding:8px 14px;font-size:.95rem;white-space:nowrap}
  #tabs button.on{background:#F5B414;color:#1E3C6E}
</style>
</head>
<body>
<div id="offline">Pas de connexion Internet : l'appli a besoin du réseau pour enregistrer les résultats.</div>
<iframe id="app" title="Conduite de chariot" allow="clipboard-write"></iframe>
<div id="tabs"><button data-p="pratique">📦 Pratique</button><button data-p="resultats">📋 Résultats et attestations</button><button data-p="">📝 Théorie (élèves)</button></div>
<div id="menu">
  <button id="btnReload" title="Actualiser" aria-label="Actualiser">⟳</button>
  <button id="btnOpen" title="Ouvrir directement" aria-label="Ouvrir directement">↗</button>
  <button id="btnSettings" title="Réglages" aria-label="Réglages">⚙</button>
</div>
<div id="setup">
  <div class="card">
    <img src="icon-192.png" alt="">
    <h1>Conduite de chariot — catégories 1A et 3</h1>
    <p class="sub">Lycée professionnel du Val Moré</p>
    <label for="url">Adresse de l'appli Apps Script (se termine par /exec)</label>
    <input id="url" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
    <div class="err" id="err"></div>
    <button class="primary" id="btnSave">Enregistrer et ouvrir</button>
    <p class="sign">Freddy ROBERT — Professeur de lycée professionnel – Transport et logistique</p>
  </div>
</div>
<script>
const DEFAULT_URL = "https://script.google.com/macros/s/AKfycbxLfEPc738EkWAoXo2jby5GCofocseTpCTxhP3lfozq7a8yw1dLNmu9746X0HsVtVXH/exec";
const KEY = "chariot.url", KPAGE = "chariot.page";
const $ = id => document.getElementById(id);
const frame = $("app"), setup = $("setup"), menu = $("menu");
const base = () => (localStorage.getItem(KEY) || DEFAULT_URL).split("?")[0];
let page = localStorage.getItem(KPAGE); if (page === null) page = "pratique";
const cur = () => base() + (page ? "?page=" + page : "");
function tabs(){ document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.p === page)); }
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { page = b.dataset.p; localStorage.setItem(KPAGE, page); tabs(); frame.src = cur(); });
function valid(u){ return /^https:\/\/script\.google\.com\/(a\/[^/]+\/)?macros\/s\/[\w-]+\/exec(\?.*)?$/.test(u.trim()); }
function showApp(u){ setup.style.display="none"; $("tabs").style.display="flex"; tabs(); frame.src=u; frame.style.display="block"; menu.style.display="flex"; }
function showSetup(){ frame.style.display="none"; $("tabs").style.display="none"; menu.style.display="none"; $("url").value=base(); setup.style.display="flex"; }
$("btnSave").onclick = () => {
  const u = $("url").value.trim();
  if(!valid(u)){ $("err").textContent = "Adresse non reconnue : elle doit commencer par https://script.google.com/macros/s/ et finir par /exec"; return; }
  $("err").textContent = ""; localStorage.setItem(KEY, u.split("?")[0]); showApp(cur());
};
$("btnSettings").onclick = showSetup;
$("btnReload").onclick = () => { frame.src = cur(); };
$("btnOpen").onclick = () => { location.href = cur(); };
function net(){ $("offline").style.display = navigator.onLine ? "none" : "block"; }
addEventListener("online", net); addEventListener("offline", net); net();
showApp(cur());
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js"); }
</script>
</body>
</html>
